<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Usuário</title>
  <link rel="stylesheet" href="stylecc.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header class="top-bar">
    <div class="container">
      <h1>Configurações</h1>
      <p>Gerencie suas configurações de usuário</p>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <nav class="tabs">
        <button class="tab">
          <i class="fa-solid fa-circle-info"></i> Alteração de Senha
        </button>
        <button class="tab active">
          <i class="fa-solid fa-user"></i> Cadastro de Usuário
        </button>
        <button class="tab">
          <i class="fa-solid fa-users"></i> Administração de Usuários
        </button>
      </nav>

      
      <h2 class="form-title">Cadastro de Usuário</h2>

     
      <form class="form">
        <div class="row">
          <div class="input-group">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Digite o nome">
          </div>
          <div class="input-group">
            <label for="sobrenome">Sobrenome</label>
            <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite o sobrenome">
          </div>
        </div>

        <div class="input-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="exemplo@email.com">
        </div>

        <div class="input-group">
          <label for="perfil">Tipo de Perfil</label>
          <select id="perfil" name="perfil">
            <option>Usuário Comum</option>
            <option>Administrador</option>
          </select>
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <div class="input-wrapper">
            <input type="password" id="senha" name="senha" placeholder="Digite a senha">
          </div>
        </div>

        <div class="input-group">
          <label for="confirmar-senha">Confirmar Senha</label>
          <div class="input-wrapper">
            <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Confirme a senha">
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="btn-primary">Cadastrar</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
